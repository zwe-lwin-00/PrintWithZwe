services:
  web:
    image: printwithzwe-web:${PZW_IMAGE_TAG:?Set PZW_IMAGE_TAG to the tested image version}
    container_name: printwithzwe-web
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        PZW_GID: ${PZW_GID:?Set PZW_GID to the existing www-data group ID}
    environment:
      PZW_PRIMARY_DOMAIN: ${PZW_PRIMARY_DOMAIN:?Set PZW_PRIMARY_DOMAIN}
      PZW_WWW_DOMAIN: ${PZW_WWW_DOMAIN:?Set PZW_WWW_DOMAIN}
      PZW_CERT_NAME: ${PZW_CERT_NAME:?Set PZW_CERT_NAME}
      PZW_API_PROXY_HOST: ${PZW_API_PROXY_HOST:?Set PZW_API_PROXY_HOST}
      PZW_MAX_REQUEST_BODY: ${PZW_MAX_REQUEST_BODY:-12m}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ${PZW_HOST_DATA:?Set PZW_HOST_DATA}/uploads:/srv/uploads:ro
      - ${PZW_CERT_ROOT:?Set PZW_CERT_ROOT}/live:/etc/letsencrypt/live:ro
      - ${PZW_CERT_ROOT}/archive:/etc/letsencrypt/archive:ro
      - ${PZW_ACME_ROOT:?Set PZW_ACME_ROOT}:/var/www/acme:ro
    networks:
      internal_api:
        ipv4_address: ${PZW_WEB_IP:?Set PZW_WEB_IP}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      - api

  api:
    image: printwithzwe-api:${PZW_IMAGE_TAG:?Set PZW_IMAGE_TAG to the tested image version}
    container_name: printwithzwe-api
    build:
      context: .
      dockerfile: backend/PrintWithZwe.Api/Dockerfile
    user: "${PZW_UID:?Set PZW_UID to the existing printwithzwe service user ID}:${PZW_GID:?Set PZW_GID to the existing www-data group ID}"
    environment:
      ReverseProxy__TrustedProxy: ${PZW_WEB_IP:?Set PZW_WEB_IP}
      AllowedHosts: ${PZW_ALLOWED_HOSTS:?Set PZW_ALLOWED_HOSTS}
      Uploads__MaxRequestBodyBytes: ${PZW_MAX_REQUEST_BODY_BYTES:-12582912}
      Uploads__MaxBytesPerImage: ${PZW_MAX_IMAGE_BYTES:-2097152}
      Uploads__MaxTotalBytes: ${PZW_MAX_TOTAL_IMAGE_BYTES:-8388608}
      Uploads__MaxDimension: ${PZW_MAX_IMAGE_DIMENSION:-2048}
    volumes:
      - ${PZW_HOST_DATA}:/var/lib/printwithzwe
    networks:
      internal_api:
        ipv4_address: ${PZW_API_IP:?Set PZW_API_IP}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 30s

  certbot:
    image: certbot/certbot:v3.0.1
    profiles: [tools]
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/printwithzwe-acme:/var/www/acme
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

networks:
  internal_api:
    ipam:
      config:
        - subnet: ${PZW_NETWORK_SUBNET:?Set PZW_NETWORK_SUBNET}
          gateway: ${PZW_NETWORK_GATEWAY:?Set PZW_NETWORK_GATEWAY}